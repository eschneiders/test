# Netlify configuration for Casa da Luz.
# `node build.js` regenerates the per-language pages (/, /pt/, /fr/, /de/),
# sitemap.xml and robots.txt from js/i18n.js + js/data.js on every deploy.

[build]
  command = "node build.js"
  publish = "."

# Nice, clean URLs and a sensible cache for static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
